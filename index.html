<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SOCROOT Topology Studio — استوديو طوبولوجيا منظمات الموظفين الرقميين</title>
    <meta name="description" content="Visual topology studio for designing, configuring, and simulating digital employee organizations based on MASTER_REFERENCE_v1.1." />
    <meta property="og:title" content="SOCROOT Topology Studio — استوديو طوبولوجيا منظمات الموظفين الرقميين" />
    <meta property="og:description" content="Visual topology studio for designing, configuring, and simulating digital employee organizations based on MASTER_REFERENCE_v1.1." />
    <meta property="og:type" content="website" />
    <script>
      (function() {
        // 1. Prevent browser extensions (e.g. VPN/request interceptors) from crashing
        // when attempting to hook `window.fetch` in iframe environments where fetch only has a getter.
        try {
          var origFetch = typeof window !== 'undefined' ? window.fetch : null;
          var currentFetch = origFetch;
          try {
            Object.defineProperty(window, 'fetch', {
              get: function() { return currentFetch; },
              set: function(v) { currentFetch = v; },
              configurable: true,
              enumerable: true
            });
          } catch (e1) {}

          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', {
                get: function() { return currentFetch; },
                set: function(v) { currentFetch = v; },
                configurable: true,
                enumerable: true
              });
            } catch (e2) {}
          }
        } catch (e) {}

        // 2. Ignore unhandled errors originating from external browser extensions (chrome-extension://, moz-extension://)
        window.addEventListener('error', function(event) {
          if (event && event.filename && (event.filename.indexOf('chrome-extension://') !== -1 || event.filename.indexOf('moz-extension://') !== -1)) {
            event.stopImmediatePropagation();
            if (typeof event.preventDefault === 'function') {
              event.preventDefault();
            }
          }
        }, true);

        // 3. Theme & language initialization
        try {
          var p = JSON.parse(localStorage.getItem('socroot:ui_prefs') || '{}');
          var lang = p.lang || 'ar';
          var theme = p.theme || 'dark';
          document.documentElement.lang = lang;
          document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
          if (theme === 'light') {
            document.documentElement.classList.add('light');
          } else {
            document.documentElement.classList.remove('light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
