name: Auto Create PR from ai/** branch

on:
  push:
    branches:
      - 'ai/**'

jobs:
  create-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Extract task reference and commit info
        id: info
        run: |
          MSG=$(git log -1 --format='%s')
          BODY=$(git log -1 --format='%b')
          TASK_REF=$(echo "$MSG $BODY" | grep -oP '(?<=TASK_REF: )\S+' || echo "")
          BRANCH="${GITHUB_REF#refs/heads/}"
          SLUG="${BRANCH#ai/}"
          echo "task_ref=$TASK_REF" >> $GITHUB_OUTPUT
          echo "commit_msg=$MSG" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "slug=$SLUG" >> $GITHUB_OUTPUT

      - name: Read task file if available
        id: task
        run: |
          TASK_FILE="docs/pipeline/tasks/${{ steps.info.outputs.task_ref }}.md"
          if [ -f "$TASK_FILE" ]; then
            TASK_CONTENT=$(cat "$TASK_FILE")
            echo "task_content<<TASK_EOF" >> $GITHUB_OUTPUT
            echo "$TASK_CONTENT" >> $GITHUB_OUTPUT
            echo "TASK_EOF" >> $GITHUB_OUTPUT
          else
            echo "task_content=No task file found." >> $GITHUB_OUTPUT
          fi

      - name: Create or Verify Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ steps.info.outputs.branch }}"
          SLUG="${{ steps.info.outputs.slug }}"
          MSG="${{ steps.info.outputs.commit_msg }}"
          TASK_REF="${{ steps.info.outputs.task_ref }}"

          echo "Checking existing PRs for head $BRANCH..."
          EXISTING_PR=$(gh pr list --head "$BRANCH" --base main --state open --json number -q '.[0].number' 2>/dev/null || echo "")

          if [ -n "$EXISTING_PR" ]; then
            echo "✅ PR #$EXISTING_PR already exists for $BRANCH."
            exit 0
          fi

          cat > pr_body.md << 'EOF'
          ## 🤖 Auto-generated by AI Pipeline

          | Field | Value |
          |---|---|
          | **Branch** | `${{ steps.info.outputs.branch }}` |
          | **Task Ref** | `${{ steps.info.outputs.task_ref }}` |
          | **Triggered by** | `push-commit.sh → ai/** branch` |

          ---

          ### 📋 Task Details
          <details>
          <summary>Click to expand task definition</summary>

          ```
          ${{ steps.task.outputs.task_content }}
          ```
          </details>

          ---

          ### 👁️ Review Instructions (for any Reviewer tool)

          > **To take over as Reviewer from any tool:**
          > 1. **AI Studio:** Open this PR URL and add review comments
          > 2. **Cursor/Windsurf IDE:** Open repo, checkout branch, review diff
          > 3. **`gh` CLI:** `gh pr review <number> --comment -b "your review"`
          > 4. **Claude/MCP:** Connect to Pipeline MCP Server → call `get_pending_reviews()`
          >
          > *The Pipeline MCP Server on the local machine always knows the current state.*

          ### ✅ Review Checklist
          - [ ] Code logic verified against acceptance criteria
          - [ ] TypeScript types correct (`npm run lint`)
          - [ ] Tests pass (`npm test`)
          - [ ] No secrets or credentials leaked
          - [ ] Performance implications considered
          - [ ] RTL/bilingual support maintained (if UI changes)
          - [ ] Ready to merge
          EOF

          echo "Creating new PR for $BRANCH..."
          gh pr create \
            --head "$BRANCH" \
            --base main \
            --title "🤖 [$SLUG] $MSG" \
            --body-file pr_body.md || echo "Warning: PR creation finished with code $?"
