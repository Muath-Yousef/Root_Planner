name: Auto Create PR from ai/** branch

on:
  push:
    branches:
      - 'ai/**'

jobs:
  create-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Extract task reference and commit info
        id: info
        run: |
          MSG=$(git log -1 --format='%s')
          BODY=$(git log -1 --format='%b')
          TASK_REF=$(echo "$MSG $BODY" | grep -oP '(?<=TASK_REF: )\S+' || echo "")
          BRANCH="${GITHUB_REF#refs/heads/}"
          SLUG="${BRANCH#ai/}"
          echo "task_ref=$TASK_REF" >> $GITHUB_OUTPUT
          echo "commit_msg=$MSG" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "slug=$SLUG" >> $GITHUB_OUTPUT

      - name: Create or Verify Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ steps.info.outputs.branch }}
          BRANCH_SLUG: ${{ steps.info.outputs.slug }}
          COMMIT_MSG: ${{ steps.info.outputs.commit_msg }}
          TASK_REF: ${{ steps.info.outputs.task_ref }}
        run: |
          echo "Checking existing PRs for head $BRANCH_NAME..."
          EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --base main --state open --json number -q '.[0].number' 2>/dev/null || echo "")

          if [ -n "$EXISTING_PR" ]; then
            echo "✅ PR #$EXISTING_PR already exists for $BRANCH_NAME."
            exit 0
          fi

          # Read task file securely if present
          TASK_FILE="docs/pipeline/tasks/${TASK_REF}.md"
          TASK_DETAILS="No linked task file found."
          if [ -n "$TASK_REF" ] && [ -f "$TASK_FILE" ]; then
            TASK_DETAILS=$(cat "$TASK_FILE")
          fi

          # Build PR body safely using Python to prevent heredoc / bash script injection
          python3 -c "
import os
branch = os.environ.get('BRANCH_NAME', '')
slug = os.environ.get('BRANCH_SLUG', '')
msg = os.environ.get('COMMIT_MSG', '')
task_ref = os.environ.get('TASK_REF', 'none')
task_details = os.environ.get('TASK_DETAILS', 'No details available.')

body = f'''## 🤖 Auto-generated by AI Pipeline

| Field | Value |
|---|---|
| **Branch** | \`{branch}\` |
| **Task Ref** | \`{task_ref}\` |
| **Triggered by** | \`push-commit.sh → ai/** branch\` |

---

### 📋 Task Details
<details>
<summary>Click to expand task definition</summary>

\`\`\`markdown
{task_details}
\`\`\`
</details>

---

### 👁️ Review Instructions (for any Reviewer tool)

> **To take over as Reviewer from any tool:**
> 1. **AI Studio:** Open this PR URL and add review comments
> 2. **Cursor/Windsurf IDE:** Open repo, checkout branch, review diff
> 3. **gh CLI:** \`gh pr review <number> --comment -b \"your review\"\`
> 4. **Claude/MCP:** Connect to Pipeline MCP Server → call \`get_pending_reviews()\`
>
> *The Pipeline MCP Server on the local machine always knows the current state.*

### ✅ Review Checklist
- [ ] Code logic verified against acceptance criteria
- [ ] TypeScript types correct (\`npm run lint\`)
- [ ] Tests pass (\`npm test\`)
- [ ] No secrets or credentials leaked
- [ ] Performance implications considered
- [ ] RTL/bilingual support maintained (if UI changes)
- [ ] Ready to merge
'''

with open('pr_body.md', 'w', encoding='utf-8') as f:
    f.write(body)
" env: TASK_DETAILS="$TASK_DETAILS"

          echo "Creating new PR for $BRANCH_NAME..."
          gh pr create \
            --head "$BRANCH_NAME" \
            --base main \
            --title "🤖 [$BRANCH_SLUG] $COMMIT_MSG" \
            --body-file pr_body.md || echo "Warning: PR creation finished with exit code $?"
