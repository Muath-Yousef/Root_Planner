name: Independent Verification (CI, E2E & Oracles)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Full Verification Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies (Oracle Validator)
        run: |
          python3 -m pip install --upgrade pip
          pip install jsonschema

      - name: Install Node Dependencies
        run: npm ci

      - name: Type Check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Build Application & Verify Bundle Chunks
        run: npm run build

      - name: Run Vitest Suite (Unit, Property & Oracle Tests)
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Real-Browser E2E Tests
        run: npx playwright test
        env:
          CI: true

      - name: Upload Test Results & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-artifacts
          path: |
            playwright-report/
            test-results/
            screenshots/
            docs/perf/baseline.json
            e2e-report.json
          retention-days: 14
