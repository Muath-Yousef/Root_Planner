  - { id: compliance, role: compliance, lane: 4, row: after-lines, label: مراجع الامتثال والإفصاح, parent: zone_dept }
  - { id: income_mgr, role: financial_controller, lane: 5, row: after-lines, label: مدير مصادر الدخل, parent: zone_dept }
  - { id: perf_analyst, role: performance_analyst, lane: 6, row: after-lines, label: محلل الأداء والدخل, parent: zone_dept }
  - { id: ssrf, role: ssrf_guard, at: [2760, 0], label: حارس SSRF ووكيل الخروج }
  - { id: l1, role: l1, at: [2760, 170], label: L1 — البيانات الخام, status: PLANNED }
  - { id: l2, role: l2, at: [2760, 340], label: L2 — قاعدة بيانات المؤثرين }
  - { id: l3, role: l3, at: [2760, 510], label: L3 — الذاكرة الدلالية, status: PLANNED }
  - { lines: ["income_register_{n}"] }
  - { id: pe, role: policy_engine, at: [2760, 1360], label: محرك السياسات }
  - { id: bg, role: budget_guard, at: [2760, 1530], label: حارس الميزانية }
  - { id: zone_web, role: zone_untrusted, at: [3020, -30], size: [260, 200], label: العالم غير الموثوق }
  - { id: web, role: external, at: [40, 70], label: Instagram, status: PLANNED, parent: zone_web }
  - { id: kill, role: kill_switch, at: [470, 1120], label: قاطع الطوارئ }

