# منظومة المؤثرين — مسودة v4: تقسيم مدراء الفرق (7 تشرين الثاني 2026).
# تُترجم عبر src/dsl/compiler.ts إلى examples/influencers_system_v4.socroot.json
# (انظر tests/influencers-v4-build.test.ts). مسودة للتقييم فقط — v3
# (البصمة ac9f0478…) ما زالت الهدف المعتمد ولم تُمسّ.
#
# التقسيم (قرار المؤسس): مدير القسم لا يسند إلى 20 موظفاً مباشرة، بل
# يوزّع العمل على 6 مدراء فرق، وكل مدير فريق يسند إلى مجموعته ويصعّد
# إلى مدير القسم. الفرق الأربعة: الاستكشاف والتحويل (3)، السياق
# والتقييم (4)، الخطوط — مدير لكل خط (3×3)، العمليات (4).
# المعايير الحاكمة الستة: كفاءة إنتاج، قابلية توسع، قابلية تتبع،
# معالجة أخطاء، تحسين وتطوير بأقل جهد وتكلفة، دون تداخل بيانات أو
# تضارب مهام — انظر docs/V4_DRAFT.md.
#
# التخطيط: صف ترويسة جديد (row 0) لمدراء الفرق فوق فرقهم؛
# lines.row_offset: 1 يزيح كتلة الخطوط وصف after-lines صفاً واحداً
# (الخطوط في الصفوف 2..4، والعمليات في الصف 5). العمود الأيمن يزيح
# صفاً واحداً تحت L3 (السجلات 850/1020/1190، ثم pe وbg)، والقاطع
# يزيح إلى 1120 — المنطقة تنمو إلى 2160×954.
#
# الإسناد: قوائم to: صريحة لهذه التجربة — قاعدة department الحالية لا
# تعبّر عن مستويين (تسند إلى كل موظفي القسم بمن فيهم مدراء الفرق).
# قاعدة فريق (dispatch: [team]) متابعة مقترحة إن اعتُمد التقسيم.
# الإيقاف يصل إلى مدراء الخطوط الثلاثة (إيقاف الخلية كاملة)، إضافة
# إلى مدير القسم والناشر والمنشئين كما في v3.
#
# عقود الموظفين: manager_id ما زال مدير القسم (inf.manager.v1) للجميع
# — بنية الفريق معبَّر عنها بكابلات الإسناد والتصعيد، لا بحقل العقد.
# توحيد manager_id مع الفريق (حقل manager لكل عقدة) متابعة مقترحة.

project:
  id: proj-influencers-system-v4
  name: منظومة المؤثرين (v4 — مسودة)
  tenant: socroot-core
  tenant_name: Sovereign Core
  isolation: logical_rls
  horizon: TRANSITIONAL
  created_at: '2026-11-07T12:45:00.000Z'

defaults:
  department: dept_influencer_system
  manager: inf.manager.v1
  prefix: inf

roles: { source: src/registry/roles/influencer.ts, custom: [collector, content_selector, creator] }

configs: { model_routing: preset, sources_watchlist: preset, pricing_config: preset }

layout: { step_x: 320, step_y: 170, pad: 40 }

lines:
  count: 3
  row_offset: 1
  nodes:
    - { id: "content_selector_{n}", role: content_selector, lane: 3, row: "{n}", label: "مختار المحتوى {n}", name: "Content Selector {n}", parent: zone_dept }
    - { id: "creator_{n}", role: creator, lane: 4, row: "{n}", label: "صانع المحتوى {n}", name: "Creator {n}", parent: zone_dept }
    - { id: "drf_{n}", role: drafter, lane: 5, row: "{n}", label: "الصائغ {n}", status: PLANNED, name: "Drafter {n}", parent: zone_dept }
    - { id: "creator_profile_{n}", role: l2, lane: 6, row: "{n}", label: "L2 — ملف صانع المحتوى {n}", status: PLANNED, parent: zone_dept }
    - { id: "income_register_{n}", role: l2, at: [2760, 850], step: [0, 170], label: "L2 — سجل مصادر الدخل {n}", status: PLANNED }

nodes:
  - { id: founder, role: founder, at: [0, 300], label: المؤسس }
  - { id: orch, role: orchestrator, at: [230, 300], label: المنسق, status: PLANNED, prefix: core }
  - { id: zone_dept, role: zone_line, at: [470, -40], label: dept_influencer_system, status: PLANNED, department_id: dept_influencer_system }
  - { id: mgr, role: manager, lane: 0, row: 3, label: مدير قطاع المؤثرين, status: PLANNED, parent: zone_dept }
  - { id: tm_acq, role: manager, lane: 1, row: 0, label: مدير فريق الاستكشاف والتحويل, status: PLANNED, parent: zone_dept, employee_id: inf.manager_acquisition.v1, name: Acquisition Team Manager }
  - { id: tm_ctx, role: manager, lane: 2, row: 0, label: مدير فريق السياق والتقييم, status: PLANNED, parent: zone_dept, employee_id: inf.manager_context.v1, name: Context Team Manager }
  - { id: tm_line_1, role: manager, lane: 3, row: 0, label: مدير الخط 1, status: PLANNED, parent: zone_dept, employee_id: inf.manager_line_1.v1, name: Line 1 Manager }
  - { id: tm_line_2, role: manager, lane: 4, row: 0, label: مدير الخط 2, status: PLANNED, parent: zone_dept, employee_id: inf.manager_line_2.v1, name: Line 2 Manager }
  - { id: tm_line_3, role: manager, lane: 5, row: 0, label: مدير الخط 3, status: PLANNED, parent: zone_dept, employee_id: inf.manager_line_3.v1, name: Line 3 Manager }
  - { id: tm_ops, role: manager, lane: 6, row: 0, label: مدير فريق العمليات, status: PLANNED, parent: zone_dept, employee_id: inf.manager_ops.v1, name: Operations Team Manager }
  - { id: scout, role: scout, lane: 1, row: 1, label: المستطلع, status: PLANNED, parent: zone_dept }
  - { id: collector, role: collector, lane: 1, row: 2, label: جامع بيانات المؤثرين, parent: zone_dept }
  - { id: transformer, role: systems_engineer, lane: 1, row: 3, label: مهندس تحويل البيانات, parent: zone_dept }
  - { id: ctx, role: context, lane: 2, row: 1, label: السياق, status: PLANNED, parent: zone_dept }
  - { id: custodian, role: knowledge_custodian, lane: 2, row: 2, label: أمين قاعدة البيانات, parent: zone_dept }
