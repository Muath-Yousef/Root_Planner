  - { from: orch, to: mgr, kind: OBJECTIVE_ROUTE }
  - { from: mgr, to: [tm_acq, tm_ctx, tm_line_1, tm_line_2, tm_line_3, tm_ops], kind: TASK_DISPATCH_RESULT }
  - { from: tm_acq, to: [scout, collector, transformer], kind: TASK_DISPATCH_RESULT }
  - { from: tm_ctx, to: [ctx, custodian, eva, str], kind: TASK_DISPATCH_RESULT }
  - { from: tm_line_1, to: [content_selector_1, creator_1, drf_1], kind: TASK_DISPATCH_RESULT }
  - { from: tm_line_2, to: [content_selector_2, creator_2, drf_2], kind: TASK_DISPATCH_RESULT }
  - { from: tm_line_3, to: [content_selector_3, creator_3, drf_3], kind: TASK_DISPATCH_RESULT }
  - { from: tm_ops, to: [publisher, compliance, income_mgr, perf_analyst], kind: TASK_DISPATCH_RESULT }
