# منظومة المؤثرين — محفظة 3 خطوط (v3)، بلغة التصميم التصريحية (المرحلتان 1 و2).
# تُترجم عبر src/dsl/compiler.ts إلى examples/influencers_system_v3.socroot.json
# بايتاً مطابقاً (البصمة ac9f0478…) — انظر tests/dsl-compiler.test.ts.
# التخطيط (المرحلة 2): أبناء القسم على الشبكة (lane/row) والقسم يُحجَّم
# تلقائياً منهم؛ العقد العليا (المؤسس، المنسق، القسم، العمود الأيمن،
# منطقة الويب، القاطع) ما زالت بإحداثيات صريحة at: — تركيب يدوي بلا
# قاعدة منتظمة (انظر docs/LAYOUT.md لماذا).

project:
  id: proj-influencers-system-v3
  name: منظومة المؤثرين (v3)
  tenant: socroot-core
  tenant_name: Sovereign Core
  isolation: logical_rls
  horizon: TRANSITIONAL
  created_at: '2026-11-07T06:19:00.000Z'

defaults:
  department: dept_influencer_system
  manager: inf.manager.v1
  prefix: inf

roles: { source: examples/influencer_roles.ts, custom: [collector, content_selector, creator] }

configs: { model_routing: preset, sources_watchlist: preset, pricing_config: preset }

layout: { step_x: 320, step_y: 170, pad: 40 }

